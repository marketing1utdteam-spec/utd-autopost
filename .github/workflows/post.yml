name: UTD autopost (IG + reels)

on:
  schedule:
    # 🔴 Це РЕЗЕРВ, а не основний тригер, і покладатись на нього не можна. Заміряно 01.09.2026:
    # із чотирьох заявлених запусків GitHub виконав ДВА — 08:00 і 14:00 UTC пропущені зовсім, а
    # 11:00 приїхав о 13:23 і 17:00 о 17:45. Розклад GitHub це побажання, а не гарантія.
    # Основний тригер — launchd `team.utdweb.autopost` на машині власника: 09:10, 12:10, 15:10,
    # 18:10, 21:10 за Києвом, зі скриптом ~/utd-runner/scripts/autopost_trigger.sh. Він не
    # запускає новий прогін, якщо попередній ще йде. До 01.09.2026 цієї задачі НЕ ІСНУВАЛО,
    # хоча коментар тут стверджував протилежне.
    - cron: "0 8,11,14,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (не публиковать, только проверить)"
        type: boolean
        default: true
      force_date:
        description: "форс-дата YYYY-MM-DD (для теста, иначе сегодня)"
        type: string
        default: ""
      max_per_run:
        description: "сколько публикаций за прогон (0 = пауза)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # 🔴 31.08.2026 прогон висел 18 минут и был снят вручную. Токены Meta и YouTube при
    # проверке оказались живыми (0.5-1.3 с и 0.3 с), то есть дело не в них, а в отсутствии
    # предела: у задачи без timeout-minutes лимит GitHub — 6 часов. Флоу, который должен
    # работать без присмотра, не имеет права держать раннер столько.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна, чтобы стейт можно было перебазировать на
          # ушедший вперёд main: в shallow-копии rebase упирается в границу.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 🔴 ffmpeg уже є на образі ubuntu-latest. Встановлення через apt було зайвим і
      # 01.09.2026 вперлось у таймаут задачі: `apt-get update` тягнув понад 20 хвилин, прогін
      # скасувався на цьому кроці, і пости не вийшли. Тепер ставимо ЛИШЕ якщо його справді немає.
      # 🔴 ffmpeg на образі ubuntu-latest ВІДСУТНІЙ — попередній коментар тут стверджував інше і
      # був неправдою. Заміряно 01.09.2026 на двох прогонах поспіль: о 16:29 крок зайняв 41 с, а
      # о 17:46 `apt-get update` висів 24 хв 39 с і зʼїв увесь timeout-minutes задачі. Розкладний
      # прогін помер на цьому кроці, пости не вийшли.
      #
      # Тому ffmpeg тепер НЕ МОЖЕ вбити прогін:
      #   timeout-minutes: 6   — повільний apt ріже сам себе, а не всю задачу
      #   continue-on-error    — без ffmpeg постинг іде далі (обидва виклики в meta_post.py
      #                          ловлять FileNotFoundError: відео піде без перекодування і без
      #                          обкладинки). Гірша якість краща за відсутній пост.
      #   install без update   — якщо списки пакетів на образі свіжі, ставиться за секунди;
      #                          update лише як запасний варіант.
      - name: ffmpeg (не критичний, прогін не валить)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg уже є: $(ffmpeg -version | head -1)"
            exit 0
          fi
          echo "ffmpeg відсутній — пробую поставити без apt-get update"
          sudo apt-get install -y ffmpeg \
            || { echo "не вийшло, оновлюю списки"; sudo apt-get update && sudo apt-get install -y ffmpeg; }
          command -v ffmpeg >/dev/null 2>&1 \
            && echo "поставлено: $(ffmpeg -version | head -1)" \
            || echo "ffmpeg поставити не вдалось — постинг піде без перекодування"
      - run: pip install -r requirements.txt
      - name: Run scheduled poster
        env:
          META_CONFIG: ${{ secrets.META_CONFIG }}
          GH_TOKEN: ${{ secrets.MEDIA_GH_TOKEN }}
          YT_CONFIG: ${{ secrets.YT_CONFIG }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
        run: |
          ARGS=""
          [ -n "${{ inputs.force_date }}" ] && ARGS="--date ${{ inputs.force_date }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python run_due.py --dry-run $ARGS
          else
            python run_due.py $ARGS
          fi
      - name: Commit posted state
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          git config user.name "utd-autopost"
          git config user.email "marketing@utdweb.team"
          git add posted.json posted_at.json failed.json
          git commit -m "posted state $(date -u +%F)" || echo "nothing to commit"
          # Тот же рецепт, что и в run_due.py: без перебазирования пуш стейта
          # отвергается, как только main ушёл вперёд, и публикации теряют память.
          for attempt in 1 2 3; do
            git push && break
            git fetch origin main && git rebase origin/main || { git rebase --abort; break; }
            echo "push отвергнут, перебазировался, попытка $attempt из 3"
          done
