name: UTD autopost (IG + reels)

on:
  schedule:
    - cron: "0 8,11,14,17 * * *"   # резерв: несколько раз/день UTC (идемпотентно; launchd — основной триггер)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (не публиковать, только проверить)"
        type: boolean
        default: true
      force_date:
        description: "форс-дата YYYY-MM-DD (для теста, иначе сегодня)"
        type: string
        default: ""
      max_per_run:
        description: "сколько публикаций за прогон (0 = пауза)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # 🔴 31.08.2026 прогон висел 18 минут и был снят вручную. Токены Meta и YouTube при
    # проверке оказались живыми (0.5-1.3 с и 0.3 с), то есть дело не в них, а в отсутствии
    # предела: у задачи без timeout-minutes лимит GitHub — 6 часов. Флоу, который должен
    # работать без присмотра, не имеет права держать раннер столько.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна, чтобы стейт можно было перебазировать на
          # ушедший вперёд main: в shallow-копии rebase упирается в границу.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Run scheduled poster
        env:
          META_CONFIG: ${{ secrets.META_CONFIG }}
          GH_TOKEN: ${{ secrets.MEDIA_GH_TOKEN }}
          YT_CONFIG: ${{ secrets.YT_CONFIG }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
        run: |
          ARGS=""
          [ -n "${{ inputs.force_date }}" ] && ARGS="--date ${{ inputs.force_date }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python run_due.py --dry-run $ARGS
          else
            python run_due.py $ARGS
          fi
      - name: Commit posted state
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          git config user.name "utd-autopost"
          git config user.email "marketing@utdweb.team"
          git add posted.json posted_at.json failed.json
          git commit -m "posted state $(date -u +%F)" || echo "nothing to commit"
          # Тот же рецепт, что и в run_due.py: без перебазирования пуш стейта
          # отвергается, как только main ушёл вперёд, и публикации теряют память.
          for attempt in 1 2 3; do
            git push && break
            git fetch origin main && git rebase origin/main || { git rebase --abort; break; }
            echo "push отвергнут, перебазировался, попытка $attempt из 3"
          done
